services:
  neon-local:
    image: neondatabase/neon_local:latest
    container_name: acquisitions-neon-local
    environment:
      NEON_API_KEY: ${NEON_API_KEY:?Set NEON_API_KEY in .env.development}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID:?Set NEON_PROJECT_ID in .env.development}
      PARENT_BRANCH_ID: ${PARENT_BRANCH_ID:?Set PARENT_BRANCH_ID in .env.development}
      DELETE_BRANCH: ${DELETE_BRANCH:-true}
    volumes:
      - ./.neon_local:/tmp/.neon_local
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: acquisitions-app-dev
    command: npm run dev
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      - neon-local
    restart: unless-stopped

volumes:
  app_node_modules:
